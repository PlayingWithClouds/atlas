version: "3"

env:
  ATLAS_WORKSPACE: '{{.ATLAS_WORKSPACE | default ".atlas-workspace"}}'

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  up:
    desc: Launch server + web via process-compose
    cmds:
      - process-compose up -U

  server:
    desc: Run the Bun server (watch mode) on :8123
    cmds:
      - bun --watch packages/server/src/main.ts "$ATLAS_WORKSPACE" --port 8123

  web:
    desc: Run the Vite dev server on :5173 (proxies /api to :8123)
    dir: packages/web
    cmds:
      - bun run dev

  test:
    desc: Run contracts, server, plugin and web tests
    cmds:
      - bun test packages/web tests/contracts tests/server plugins

  check:
    desc: Typecheck contracts, server and plugins; svelte-check web + plugin web configs
    cmds:
      - ./scripts/check.sh

  init:
    desc: Create the workspace directory ($ATLAS_WORKSPACE, default .atlas-workspace) with a starter atlas.json
    cmds:
      - bun packages/server/src/main.ts init "$ATLAS_WORKSPACE"
