# Launch the Atlas dev stack locally (run from the repo root):
#
#   process-compose up -U          # TUI with per-process logs
#   process-compose up -U -t=false # plain, no TUI
#
# -U puts process-compose's own API on a unix socket: its default TCP port 8080
# is where the veil backend listens.
#
# `server` is the Bun host (restarts on source changes; plugins in the workspace's
# atlas.json also hot-reload on their own). `web` is the Vite dev server, which proxies
# /api to the server. Open http://localhost:5173.
#
# ATLAS_WORKSPACE selects the workspace directory (default .atlas-workspace); create one with
# `task init`. Every process inherits it.
version: "0.5"

environment:
  - "ATLAS_WORKSPACE=${ATLAS_WORKSPACE:-.atlas-workspace}"
  - "ATLAS_PORT=8123"

processes:
  server:
    command: "bun --watch packages/server/src/main.ts $ATLAS_WORKSPACE --port 8123"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8123
        path: /api/health
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 30

  web:
    command: "bun run dev --host --port 5173"
    working_dir: "packages/web"
    depends_on:
      server:
        condition: process_healthy
