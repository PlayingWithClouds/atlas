[project]
name = "atlas-plugin-sdk"
version = "0.1.0"
description = "Atlas plugin SDK (Python) — JSON-RPC 2.0 HTTP plugin helper"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_plugin_sdk"]
